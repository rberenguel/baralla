<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Card Sandbox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts/phosphor/phosphor.css">
</head>
<body>

<div id="app">
    <div id="table"></div>
</div>

<div id="radial-menu"></div>

<div id="setup-modal" class="setup-modal hidden">
  <div class="setup-modal-box">
    <div class="setup-modal-header">
      <span class="setup-modal-title">Setup</span>
      <button id="setup-modal-close">✕</button>
    </div>
    <textarea id="setup-textarea" spellcheck="false" placeholder="Paste or type a setup..."></textarea>
    <div class="setup-modal-actions">
      <button id="setup-apply-btn">Apply</button>
      <button id="setup-copy-btn">Copy</button>
    </div>
  </div>
</div>

<script src="lib/marked.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
